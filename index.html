<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030308">
<title>PROJECT NIGHT</title>
<style>
:root{--bg:#030308;--line:rgba(255,255,255,.1);--text:#f7f7fb;--muted:#858593}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0;color:inherit;cursor:pointer}#space{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.035;background-image:radial-gradient(rgba(255,255,255,.8) .6px,transparent .7px);background-size:4px 4px}.app{position:relative;z-index:2;min-height:100vh}.panic{position:fixed;z-index:80;top:9px;left:50%;transform:translateX(-50%);height:30px;padding:0 16px;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:rgba(5,5,10,.72);backdrop-filter:blur(18px);font-size:8px;font-weight:850;letter-spacing:.18em;color:#d7d7dc;transition:.3s}.panic:hover{background:#fff;color:#05050a;box-shadow:0 8px 35px rgba(255,255,255,.13)}.top{position:fixed;top:51px;left:20px;right:20px;height:56px;z-index:60;display:flex;align-items:center;gap:11px;padding:0 12px;border:1px solid var(--line);border-radius:17px;background:rgba(7,7,12,.52);backdrop-filter:blur(24px);box-shadow:0 18px 70px #0005}.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:#ffffff08;border:1px solid #ffffff0d;transition:.3s cubic-bezier(.16,1,.3,1)}.iconbtn:hover{background:#ffffff12;transform:scale(1.04)}.brand{font-size:12px;font-weight:900;letter-spacing:-.035em}.spacer{flex:1}.hint{font-size:8px;color:#666673;letter-spacing:.14em}.status{width:6px;height:6px;border-radius:50%;background:#e4e4e8;box-shadow:0 0 14px #fff;animation:statusPulse 2s ease-in-out infinite}main{min-height:100vh;padding:132px 22px 55px;display:flex;align-items:center;justify-content:center}.home{position:relative;width:min(1120px,100%);padding:48px 42px 42px;border:1px solid rgba(255,255,255,.07);border-radius:32px;background:linear-gradient(145deg,rgba(255,255,255,.038),rgba(255,255,255,.009));box-shadow:0 38px 110px #0008,inset 0 1px rgba(255,255,255,.04);overflow:hidden}.home:before{content:"";position:absolute;width:620px;height:260px;left:50%;top:-200px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,255,255,.1),transparent 68%);filter:blur(25px);pointer-events:none}.home:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.025) 50%,transparent 80%);transform:translateX(-100%);animation:panelSweep 10s ease-in-out infinite;pointer-events:none}.hero{position:relative;z-index:2;text-align:center}.overline{font-size:8px;letter-spacing:.31em;text-transform:uppercase;color:#81818c;margin-bottom:19px}.titleWrap{display:flex;align-items:center;justify-content:center;min-height:clamp(55px,8vw,92px)}.title{display:flex;justify-content:center;align-items:center;flex-wrap:nowrap;white-space:nowrap;margin:0;font-size:clamp(40px,7vw,82px);line-height:1;letter-spacing:-.075em;font-weight:950}.letter{position:relative;display:inline-block;opacity:0;color:#aaa;background:linear-gradient(112deg,#666 0%,#9a9aa3 20%,#fff 43%,#d8d8dd 50%,#707078 70%,#aaa 100%);background-size:270% 100%;background-position:0 50%;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 0 rgba(255,255,255,0));animation:letterIn .24s ease-out forwards,letterSweep 2.1s cubic-bezier(.45,0,.25,1) infinite,letterGlow 2.1s ease-in-out infinite;animation-delay:calc(var(--i)*.075s),calc(.28s + var(--i)*.075s),calc(.28s + var(--i)*.075s)}.cursor{width:3px;height:.72em;flex:0 0 3px;margin-left:10px;background:#ededf0;box-shadow:0 0 16px #fff8;opacity:0;transition:opacity .12s}.sub{max-width:620px;margin:22px auto 0;color:#858591;font-size:11px;line-height:1.8;opacity:0;animation:fadeIn .7s 1.05s forwards}.featured{position:relative;z-index:2;margin-top:38px}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}.sectionTitle{font-size:11px;font-weight:850;letter-spacing:.02em}.sectionMeta{font-size:8px;color:#5e5e69;letter-spacing:.12em;text-transform:uppercase}.gameGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.game{position:relative;min-width:0;padding:0;text-align:left;border:1px solid rgba(255,255,255,.08);border-radius:17px;overflow:hidden;background:#ffffff05;transition:transform .35s cubic-bezier(.16,1,.3,1),border-color .35s,box-shadow .35s}.game.available:hover{transform:translateY(-5px);border-color:#ffffff25;box-shadow:0 20px 45px #0008}.game.disabled{cursor:default;opacity:.72}.thumb{position:relative;height:126px;overflow:hidden;background:#0a0a10}.thumb:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.16),transparent 30%),linear-gradient(135deg,rgba(255,255,255,.06),transparent 55%)}.thumb svg{position:absolute;inset:0;width:100%;height:100%;padding:22px;filter:drop-shadow(0 12px 18px #0008)}.thumb.snake{background:linear-gradient(135deg,#11121a,#252331 55%,#08080d)}.thumb.pong{background:linear-gradient(135deg,#091016,#152b35 55%,#05070a)}.thumb.orbit{background:radial-gradient(circle at 50% 50%,#45415b 0 3%,#171522 4% 12%,#09090f 45%)}.thumb.memory{background:linear-gradient(135deg,#17141e,#302b3e 55%,#0a0910)}.thumb.block{background:linear-gradient(135deg,#10131a,#27313b 55%,#08090c)}.gameInfo{padding:11px 12px 12px}.gameName{font-size:10px;font-weight:850}.gameDesc{margin-top:4px;font-size:8px;color:#666674;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{position:absolute;top:9px;right:9px;padding:5px 7px;border-radius:999px;background:#05050acc;border:1px solid #ffffff16;backdrop-filter:blur(10px);font-size:6px;letter-spacing:.13em;text-transform:uppercase;color:#a4a4ae}.available .badge{color:#e2e2e7}.openhint{display:inline-flex;align-items:center;gap:9px;margin-top:25px;padding:10px 14px;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:#ffffff05;color:#777783;font-size:8px;letter-spacing:.17em;text-transform:uppercase;transition:.3s}.openhint:before{content:"";width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 11px #fff}.openhint:hover{border-color:#ffffff1b;background:#ffffff09;color:#aaaab3}.version{position:absolute;z-index:3;right:22px;bottom:17px;color:#555560;font-size:7px;letter-spacing:.16em}.drawerback{position:fixed;inset:0;z-index:69;background:#0008;opacity:0;visibility:hidden;transition:.3s}.drawerback.open{opacity:1;visibility:visible}.drawer{position:fixed;z-index:70;left:16px;top:120px;bottom:16px;width:min(410px,calc(100vw - 32px));padding:15px;border:1px solid var(--line);border-radius:25px;background:rgba(8,8,14,.86);backdrop-filter:blur(30px);box-shadow:0 35px 100px #0009;transform:translateX(calc(-100% - 35px));transition:transform .6s cubic-bezier(.16,1.2,.3,1)}.drawer.open{transform:none}.drawerhead{display:flex;align-items:center;gap:9px;padding:4px 2px 14px}.drawerhead strong{font-size:13px}.library{font-size:8px;color:#666673}.close{margin-left:auto;width:33px;height:33px;border-radius:10px;background:#ffffff0a}.search{width:100%;height:40px;border:1px solid var(--line);border-radius:12px;background:#ffffff06;padding:0 12px;color:#fff;outline:none;margin-bottom:11px}.search:focus{border-color:#ffffff35;box-shadow:0 0 0 3px #ffffff05}.list{height:calc(100% - 103px);overflow:auto}.project{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:11px;border-radius:14px;background:transparent;transition:.25s;margin-bottom:4px}.project:hover{background:#ffffff0f;transform:translateX(4px)}.picon{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#ffffff16,#ffffff04);border:1px solid var(--line);color:#e1e1e5;font-weight:800}.ptext{min-width:0}.pname{display:block;font-size:11px;font-weight:800}.pdesc{display:block;margin-top:3px;color:#666674;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{margin-left:auto;color:#5f5f6c}.empty{padding:30px 8px;color:#62626f;font-size:9px;text-align:center}.player{position:fixed;inset:0;z-index:100;background:#020205;display:none}.player.open{display:block;animation:fade .25s both}.playerbar{position:absolute;z-index:5;top:14px;left:14px;right:14px;height:50px;display:flex;align-items:center;padding:0 10px;border:1px solid #ffffff1a;border-radius:15px;background:#07070cb8;backdrop-filter:blur(20px);opacity:0;transition:.25s}.player:hover .playerbar,.playerbar:focus-within{opacity:1}.playername{font-size:12px;font-weight:800}.playerstate{margin-left:9px;color:#666674;font-size:9px}.playercontrols{margin-left:auto;display:flex;gap:7px}.playercontrols button{height:32px;padding:0 10px;border-radius:9px;background:#ffffff0a;font-size:9px}.playercontrols button:hover{background:#ffffff18}.loading{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:#05050a;pointer-events:none;opacity:0;transition:.25s}.loading.show{opacity:1}.loader{font-size:9px;letter-spacing:.25em;color:#777785;text-transform:uppercase}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#020205}@keyframes letterIn{from{opacity:0;transform:translateY(3px) scale(.985)}to{opacity:1;transform:none}}@keyframes letterSweep{0%{background-position:0 50%}45%,100%{background-position:100% 50%}}@keyframes letterGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}42%{filter:drop-shadow(0 0 9px rgba(255,255,255,.22))}55%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes fade{to{opacity:1}}@keyframes panelSweep{0%,55%{transform:translateX(-100%)}75%,100%{transform:translateX(100%)}}@keyframes statusPulse{50%{opacity:.45;transform:scale(.75)}}@media(max-width:900px){.home{padding:42px 25px}.gameGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.thumb{height:120px}}@media(max-width:650px){.top{left:10px;right:10px}.hint{display:none}main{padding:125px 12px 38px}.home{padding:40px 15px 52px;border-radius:27px}.title{font-size:clamp(30px,9.5vw,60px);letter-spacing:-.065em}.cursor{margin-left:7px;width:2px;flex-basis:2px}.sub{font-size:10px}.gameGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.thumb{height:108px}.gameInfo{padding:9px}.version{right:16px;bottom:14px}.featured{margin-top:30px}.sectionTitle{font-size:10px}}
</style>
</head>
<body>
<canvas id="space"></canvas><div class="grain"></div><div class="app">
<button class="panic" id="panic">PANIC</button>
<header class="top"><button class="iconbtn" id="menu" aria-label="Open projects"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="brand">PROJECT NIGHT</div><div class="spacer"></div><span class="hint">PROJECTS</span><span class="status"></span></header>
<main><section class="home">
<div class="hero"><div class="overline">A private collection of interactive projects</div><div class="titleWrap"><h1 class="title" id="title"></h1><span class="cursor" id="cursor"></span></div><p class="sub">A focused library of small interactive experiences. Pick a project below or open the full project panel.</p></div>
<div class="featured"><div class="sectionHead"><span class="sectionTitle">Featured projects</span><span class="sectionMeta">5 projects</span></div><div class="gameGrid" id="gameGrid"></div><div class="openhint" id="openHint">Open the full project panel</div></div>
<span class="version">v1.0.4</span>
</section></main></div>
<div class="drawerback" id="backdrop"></div><aside class="drawer" id="drawer"><div class="drawerhead"><strong>Projects</strong><span class="library">LIBRARY</span><button class="close" id="close">×</button></div><input class="search" id="search" placeholder="Search projects..." autocomplete="off"><div class="list" id="list"></div></aside>
<section class="player" id="player"><div class="playerbar"><span class="playername" id="playerName">PROJECT</span><span class="playerstate">RUNNING</span><div class="playercontrols"><button id="reload">Reload</button><button id="full">Fullscreen</button><button id="closePlayer">Close</button></div></div><div class="loading" id="loading"><div class="loader">Loading project</div></div><iframe id="frame" title="Project player" allow="fullscreen; autoplay; gamepad"></iframe></section>
<script>
const projects=[{name:'Snake',desc:'Classic grid survival project',icon:'S',src:'projects/snake.html',type:'snake',available:true},{name:'Neon Pong',desc:'Classic paddle duel project',icon:'P',type:'pong',available:false},{name:'Orbit',desc:'Gravity and timing project',icon:'O',type:'orbit',available:false},{name:'Memory Grid',desc:'Pattern matching project',icon:'M',type:'memory',available:false},{name:'Block Rush',desc:'Fast arcade project',icon:'B',type:'block',available:false}];
const $=s=>document.querySelector(s),drawer=$('#drawer'),backdrop=$('#backdrop'),player=$('#player'),frame=$('#frame'),loading=$('#loading'),list=$('#list'),gameGrid=$('#gameGrid');
const icons={snake:'<svg viewBox="0 0 120 90" fill="none"><path d="M20 65c0-28 28-35 48-22 16 10 30 5 31-9 1-9-7-15-15-12-7 2-8 11-3 15" stroke="#fff" stroke-width="8" stroke-linecap="round"/><circle cx="84" cy="22" r="4" fill="#fff"/></svg>',pong:'<svg viewBox="0 0 120 90" fill="none"><rect x="16" y="20" width="6" height="50" rx="3" fill="#fff"/><rect x="98" y="32" width="6" height="38" rx="3" fill="#bbb"/><circle cx="60" cy="45" r="6" fill="#fff"/><path d="M27 45h22M71 45h19" stroke="#888" stroke-width="2" stroke-dasharray="5 5"/></svg>',orbit:'<svg viewBox="0 0 120 90" fill="none"><circle cx="60" cy="45" r="10" fill="#fff"/><ellipse cx="60" cy="45" rx="43" ry="18" stroke="#bbb" stroke-width="2"/><circle cx="94" cy="45" r="4" fill="#fff"/></svg>',memory:'<svg viewBox="0 0 120 90" fill="none"><rect x="25" y="16" width="28" height="25" rx="5" stroke="#fff" stroke-width="3"/><rect x="67" y="16" width="28" height="25" rx="5" stroke="#888" stroke-width="3"/><rect x="25" y="49" width="28" height="25" rx="5" stroke="#888" stroke-width="3"/><rect x="67" y="49" width="28" height="25" rx="5" stroke="#fff" stroke-width="3"/></svg>',block:'<svg viewBox="0 0 120 90" fill="none"><path d="M25 65 42 48l14 10 18-27 22 34H25Z" fill="#aaa"/><path d="M31 65h67" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>'};
function cardMarkup(p){return `<button class="game ${p.available?'available':'disabled'}" ${p.available?'data-project="'+projects.indexOf(p)+'"':''}><div class="thumb ${p.type}">${icons[p.type]}<span class="badge">${p.available?'Play':'Soon'}</span></div><div class="gameInfo"><div class="gameName">${p.name}</div><div class="gameDesc">${p.desc}</div></div></button>`}
function renderHome(){gameGrid.innerHTML=projects.map(cardMarkup).join('')}
function render(q=''){const x=q.toLowerCase().trim(),rows=projects.filter(p=>(p.name+' '+p.desc).toLowerCase().includes(x));list.innerHTML=rows.length?rows.map(p=>`<button class="project" data-i="${projects.indexOf(p)}"><span class="picon">${p.icon}</span><span class="ptext"><span class="pname">${p.name}</span><span class="pdesc">${p.desc}</span></span><span class="arrow">›</span></button>`).join(''):'<div class="empty">No projects found.</div>'}
function openDrawer(){drawer.classList.add('open');backdrop.classList.add('open');setTimeout(()=>$('#search').focus(),350)}function closeDrawer(){drawer.classList.remove('open');backdrop.classList.remove('open')}
function openProject(p){if(!p.available)return;closeDrawer();$('#playerName').textContent=p.name;player.classList.add('open');loading.classList.add('show');frame.src=p.src;document.body.style.overflow='hidden';frame.onload=()=>loading.classList.remove('show')}
function closePlayer(){player.classList.remove('open');frame.src='about:blank';document.body.style.overflow=''}
$('#menu').onclick=openDrawer;$('#close').onclick=closeDrawer;backdrop.onclick=closeDrawer;$('#search').oninput=e=>render(e.target.value);list.onclick=e=>{const b=e.target.closest('.project');if(b)openProject(projects[+b.dataset.i])};gameGrid.onclick=e=>{const b=e.target.closest('.game.available');if(b)openProject(projects[+b.dataset.project])};$('#openHint').onclick=openDrawer;$('#closePlayer').onclick=closePlayer;$('#reload').onclick=()=>{loading.classList.add('show');frame.contentWindow.location.reload()};$('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else frame.requestFullscreen?.()};$('#panic').onclick=()=>window.open('https://classroom.google.com/','_blank','noopener,noreferrer');window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(player.classList.contains('open'))closePlayer();else closeDrawer()}if(e.key.toLowerCase()==='f'&&player.classList.contains('open'))$('#full').click()});
const title='PROJECT NIGHT',t=$('#title'),cursor=$('#cursor');let typingRun=0;
function typeTitle(){const run=++typingRun;t.innerHTML='';cursor.style.opacity='1';[...title].forEach((c,i)=>{setTimeout(()=>{if(run!==typingRun)return;const s=document.createElement('span');s.className='letter';s.style.setProperty('--i',i);s.textContent=c===' '?'\u00a0':c;t.appendChild(s)},i*92)});setTimeout(()=>{if(run===typingRun)cursor.style.opacity='1'},title.length*92+80)}
typeTitle();setInterval(typeTitle,5200);render();renderHome();
const c=$('#space'),ctx=c.getContext('2d'),stars=[];let W,H,mx=.5,my=.5;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'}function seed(){stars.length=0;for(let i=0;i<260;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.2,z:Math.random(),tw:Math.random()*6.28})}function draw(time){ctx.clearRect(0,0,W,H);const dpr=devicePixelRatio||1;for(const s of stars){const px=(s.x*innerWidth+(mx-.5)*(12+28*s.z)*s.z)%innerWidth,py=(s.y*innerHeight+(my-.5)*(9+22*s.z)*s.z)%innerHeight,x=(px<0?px+innerWidth:px)*dpr,y=(py<0?py+innerHeight:py)*dpr,a=.18+.5*(.5+.5*Math.sin(time*.001+s.tw));ctx.beginPath();ctx.globalAlpha=a;ctx.fillStyle='#fff';ctx.arc(x,y,s.r*dpr,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(draw)}addEventListener('resize',resize);addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});resize();seed();requestAnimationFrame(draw);
</script>
</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake — PROJECT NIGHT</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05050a;color:#fff;font-family:system-ui, sans-serif}body{display:grid;place-items:center}.wrap{text-align:center}.hud{display:flex;justify-content:space-between;align-items:center;width:min(520px,90vw);margin-bottom:12px;font-size:12px;color:#999}.hud strong{font-size:20px;color:#fff}canvas{display:block;width:min(520px,90vw);height:min(520px,90vw);border:1px solid #ffffff18;border-radius:20px;background:#08080e;box-shadow:0 30px 90px #0008}p{color:#686874;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.again{margin-top:12px;padding:9px 14px;border-radius:10px;border:1px solid #ffffff12;background:#ffffff09;color:#ddd;cursor:pointer}</style></head><body><div class="wrap"><div class="hud"><span>SNAKE</span><strong id="score">0</strong><span>WASD / ARROWS</span></div><canvas id="game" width="520" height="520"></canvas><p id="msg">Collect the glowing squares. Don't hit yourself or the wall.</p><button class="again" id="again" hidden>Restart Project</button></div><script>const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),msg=document.getElementById('msg'),again=document.getElementById('again');const N=26,cell=c.width/N;let snake,food,dir,next,score,dead,timer;function start(){snake=[{x:13,y:13},{x:12,y:13},{x:11,y:13}];dir={x:1,y:0};next={x:1,y:0};score=0;dead=false;again.hidden=true;scoreEl.textContent=0;msg.textContent="Collect the glowing squares. Don't hit yourself or the wall.";place();clearInterval(timer);timer=setInterval(tick,105);draw()}function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}function tick(){if(dead)return;dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){end();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent=score;place()}else snake.pop();draw()}function end(){dead=true;clearInterval(timer);msg.textContent='Project over — you hit the wall or yourself.';again.hidden=false;draw()}function draw(){x.clearRect(0,0,c.width,c.height);x.strokeStyle='#ffffff08';for(let i=1;i<N;i++){x.beginPath();x.moveTo(i*cell,0);x.lineTo(i*cell,c.height);x.stroke();x.beginPath();x.moveTo(0,i*cell);x.lineTo(c.width,i*cell);x.stroke()}x.fillStyle='#bba8ff';x.shadowBlur=22;x.shadowColor='#a98cff';x.fillRect(food.x*cell+cell*.25,food.y*cell+cell*.25,cell*.5,cell*.5);x.shadowBlur=0;snake.forEach((s,i)=>{x.fillStyle=i?'#aaa0d8':'#fff';x.beginPath();x.roundRect(s.x*cell+3,s.y*cell+3,cell-6,cell-6,8);x.fill()});if(dead){x.fillStyle='#05050acc';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fff';x.font='700 28px system-ui';x.textAlign='center';x.fillText('PROJECT OVER',c.width/2,c.height/2)}}function set(d){if(d.x!==-dir.x||d.y!==-dir.y)next=d}addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowup'||k==='w')set({x:0,y:-1});if(k==='arrowdown'||k==='s')set({x:0,y:1});if(k==='arrowleft'||k==='a')set({x:-1,y:0});if(k==='arrowright'||k==='d')set({x:1,y:0})});again.onclick=start;start();</script></body></html>
